name: Deploy Production

on:
  workflow_run:
    workflows: [CI, Security]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  gate:
    name: Confirm CI and Security passed for this commit
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      ci-run-id: ${{ steps.runs.outputs.ci-run-id }}
    steps:
      - name: Find the passing CI and Security runs for this commit
        id: runs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          COMMIT_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          ci=$(gh run list --workflow ci.yml --commit "$COMMIT_SHA" --event push --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          security=$(gh run list --workflow security.yml --commit "$COMMIT_SHA" --event push --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          echo "CI run: ${ci:-not passed yet}, Security run: ${security:-not passed yet}"
          if [ -n "$ci" ] && [ -n "$security" ]; then
            echo "ci-run-id=$ci" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    name: Deploy to Cloudflare Pages
    needs: gate
    if: needs.gate.outputs.ci-run-id != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: production
    permissions:
      contents: read
      actions: read
    steps:
      - name: Check out the tested commit for the Node and Wrangler versions
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
          sparse-checkout: .github/deploy
      - name: Set up Node from .nvmrc
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: .nvmrc
      - name: Install the pinned Wrangler
        run: npm ci --prefix .github/deploy --no-audit --no-fund
      - name: Download the tested site build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: dist
          path: dist
          run-id: ${{ needs.gate.outputs.ci-run-id }}
          github-token: ${{ github.token }}
      - name: Publish to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
          COMMIT_SHA: ${{ github.event.workflow_run.head_sha }}
        run: .github/deploy/node_modules/.bin/wrangler pages deploy dist --project-name=portfolio --branch=main --commit-hash="$COMMIT_SHA"
